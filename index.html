<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Title</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body class="body">
    <header class="header">
      <div class="header__top">
        <a class="header__top__logo">
          <img
            src="/src/images/icons/logo.svg"
            alt="logo"
          />
        </a>
        <nav class="header__top__links">
          <ul class="header__top__links__list">
            <li class="header__top__links__list__link"></li>
            <li class="header__top__links__list__link"></li>
            <li class="header__top__links__list__link"></li>
            <li class="header__top__links__list__link"></li>
          </ul>
        </nav>

        <a
          href="#"
          class="header__top__burger"
        >
          <img
            src="/src/images/icons/burger.svg"
            alt="burger-menu"
          />
        </a>
      </div>

      <div class="header__wrapper">
        <div class="header__middle">
          <h2 class="header__middle__text">
            We bake your fantasies — croissants, cakes, cookies, and cupcakes.
          </h2>
        </div>

        <div class="header__bottom">
          <h1 class="header__bottom__title">Creative bakery</h1>
          <div class="header__bottom__box">
            <img
              class="header__bottom__box__img"
              src="/src/images/cookies/cookie-header.png"
              alt="cookie"
            />
          </div>
          <a
            href="#learn-more"
            class="header__bottom__btn"
          >
            <img
              class="header__bottom__btn__img"
              src="/src/images/icons/button-img.svg"
              alt="#"
            />
            learn more
          </a>
        </div>
      </div>
    </header>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
